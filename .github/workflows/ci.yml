name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ready:
    name: Format, Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ready checks (vp check, vp test, website build)
        run: pnpm run ready

  database-authorization:
    name: Database authorization
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PGHOST: 127.0.0.1
      PGPORT: "54322"
      PGUSER: postgres
      PGDATABASE: postgres
      PGPASSWORD: postgres # Local Supabase defaults for this disposable runner.
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.122.0

      - name: Replay migrations in an isolated database
        run: |
          # Use the production PostgreSQL minor release for this isolated stack.
          printf '%s' '17.11.0.019' > supabase/.temp/postgres-version
          supabase start
          supabase db reset --local --no-seed

      - name: Verify migration history and effective privileges
        run: bash supabase/verify-authorization.sh

      - name: Exercise authorization as API roles
        run: |
          for test in supabase/tests/*.sql; do
            psql -X -w -v ON_ERROR_STOP=1 -f "$test" || exit
          done

      - name: Show local database logs on failure
        if: failure()
        run: |
          docker ps -aq --filter 'name=supabase_db_' | while read -r container; do
            docker inspect --format '{{json .State}}' "$container"
            docker logs --tail 120 "$container"
          done
